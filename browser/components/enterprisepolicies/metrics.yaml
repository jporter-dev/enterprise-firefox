# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: Enterprise Policies'

#ifdef MOZ_ENTERPRISE
content_policy:
  blocklist_domain_browsed:
    type: event
    data_sensitivity:
      - highly_sensitive
    description: >
      Recorded when a domain blocked by policy is browsed.
      Only collected when MOZ_ENTERPRISE is defined and enabled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    notification_emails:
      - security-telemetry@mozilla.org
      - enterprise-telemetry@mozilla.org
    expires: never
    send_in_pings:
      - enterprise
    extra_keys:
      url:
        description: >
          The url that was blocked by policy.
        type: string
      original_url:
        description: >
          The original url, prior to redirects, that was requested resulting in a block,
          if different from the blocked url.
        type: string
      referrer:
        description: >
          The referrer address from which the url was requested.
        type: string

access_connector:
  proxy_error:
    type: event
    description: >
      Recorded when the Access Connector proxy error state is shown to the
      user (urlbar button enters error state due to a proxy connection failure).
      Only collected when MOZ_ENTERPRISE is defined and enabled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_sensitivity:
      - interaction
    notification_emails:
      - security-telemetry@mozilla.org
      - enterprise-telemetry@mozilla.org
    expires: never
    send_in_pings:
      - enterprise
    extra_keys:
      domain:
        description: >
          The hostname of the site that failed to load through the Access
          Connector proxy.
        type: string
#endif
