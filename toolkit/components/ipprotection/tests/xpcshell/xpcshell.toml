[DEFAULT]
run-if = [
  "os != 'android'",
]
head = "head.js"
firefox-appdir = "browser"
prefs = [
  "browser.ipProtection.enabled=true",
  "browser.ipProtection.cacheDisabled=true",
]

["test_GuardianClient.js"]

["test_IPPAutoRestore.js"]

["test_IPPChannelFilter.js"]

["test_IPPEnterpriseAuthProvider.js"]

["test_IPPExceptionsManager.js"]

["test_IPPFxaAuthProvider.js"]

["test_IPPGpiAuthProvider.js"]

["test_IPPSessionPrefManager.js"]

["test_IPPStartupCache.js"]

["test_IPProtectionServerlist.js"]

["test_IPProtectionService.js"]

["test_IPProtectionStates.js"]

# On non-enterprise builds IPProtectionServerlist is RemoteSettingsServerlist and
# ignores the pref-based server list set up in add_setup, so hasList stays false
# and proxy activation tests time out.
["test_IPPAlwaysOn.js"]
run-if = ["enterprise"]

["test_IPProxyManager.js"]
